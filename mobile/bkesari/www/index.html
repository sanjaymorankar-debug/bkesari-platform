<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="color-scheme" content="light dark">
<title>bkesari</title>
<style>
  :root{--page:#FAF8F5;--surface:#FFFFFF;--ink:#1C1917;--muted:#57534E;--border:#E7E5E4;--brand:#C2560A;--brand-hover:#A64808;--on-brand:#FFFFFF;--error:#B91C1C;--focus:#C2560A}
  @media (prefers-color-scheme:dark){:root{--page:#141110;--surface:#1F1B19;--ink:#F5F5F4;--muted:#C9C4BF;--border:#3A3532;--brand:#F08A3C;--brand-hover:#F5A869;--on-brand:#1C1917;--error:#FCA5A5;--focus:#F5A869}}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{min-height:100vh;display:grid;place-items:center;background:var(--page);color:var(--ink);
    font:17px/1.5 system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans Devanagari',sans-serif;
    padding:max(24px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
  main{width:100%;max-width:400px;text-align:center}
  .mark{width:64px;height:64px;border-radius:16px;background:var(--brand);color:var(--on-brand);margin:0 auto 12px;
    display:grid;place-items:center;font-size:36px;font-weight:800;line-height:1}
  h1{margin:0;font-size:28px;letter-spacing:-.01em}
  .lede{margin:4px 0 28px;color:var(--muted)}
  .actions{display:grid;gap:12px}
  button,.button,.routes a{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;min-height:48px;padding:0 20px;
    border-radius:12px;font:inherit;font-weight:700;text-decoration:none;cursor:pointer}
  .google{background:#FFFFFF;color:#1F1F1F;border:1px solid #747775}
  .google:disabled{opacity:.6;cursor:progress}
  .google svg{flex:none}
  .button{background:var(--brand);color:var(--on-brand);border:0}
  .button:active{background:var(--brand-hover)}
  :focus-visible{outline:3px solid var(--focus);outline-offset:2px}
  .status{min-height:1.5em;margin:4px 0 0;font-size:15px;color:var(--muted)}
  .status.error{color:var(--error)}
  .routes{margin:28px 0 0;padding:16px 0 0;border-top:1px solid var(--border);display:grid;gap:8px}
  .routes a{background:var(--surface);color:var(--ink);border:1px solid var(--border);font-weight:600}
  .note{margin:24px 0 0;font-size:15px;color:var(--muted)}
  .version{margin:16px 0 0;font-size:13px;color:var(--muted)}
  .is-starting .actions,.is-starting .routes,.is-starting .note{visibility:hidden}
</style>
</head>
<body class="is-starting">
<main>
  <div class="mark" aria-hidden="true">b</div>
  <h1>bkesari</h1>
  <p class="lede">One sign-in for LadWani, bkesari Education and TaskList.</p>

  <div class="actions">
    <button id="google" class="google" type="button">
      <svg viewBox="0 0 48 48" width="20" height="20" aria-hidden="true" focusable="false">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
      </svg>
      <span>Continue with Google</span>
    </button>
    <a id="email" class="button" href="https://bkesari.com/auth/sign-in?next=%2F">Sign in with an email code</a>
    <p id="status" class="status" role="status" aria-live="polite"></p>
  </div>

  <nav id="routes" class="routes" aria-label="bkesari" hidden>
    <a data-path="/" href="https://bkesari.com/">Your projects</a>
    <a data-path="/access/request" href="https://bkesari.com/access/request">Request access</a>
    <a data-path="/account" href="https://bkesari.com/account">Your profile</a>
  </nav>

  <p class="note">After signing in, ask for access to a project. A bkesari administrator approves each request.</p>
  <p id="version" class="version"></p>
</main>
<script src="config.js"></script>
<script src="vendor/capacitor.js"></script>
<script src="vendor/app.js"></script>
<script src="vendor/browser.js"></script>
<script src="js/auth-core.js"></script>
<script src="js/start.js"></script>
</body>
</html>
