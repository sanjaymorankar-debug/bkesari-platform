<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>bkesari</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px 16px;box-sizing:border-box;
    background:#FAF8F5;color:#1C1917;font:17px/1.5 system-ui,'Noto Sans Devanagari',sans-serif}
  @media (prefers-color-scheme:dark){body{background:#141110;color:#F5F5F4}}
  .mark{width:64px;height:64px;border-radius:16px;background:#C2560A;margin:0 auto 16px}
  a{display:inline-flex;align-items:center;min-height:48px;padding:0 20px;border-radius:10px;background:#C2560A;color:#fff;font-weight:700;text-decoration:none}
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true"></div>
  <h1>bkesari</h1>
  <p>You are offline or bkesari.com could not be reached.<br>
  <span lang="mr">इंटरनेट जोडणी तपासा.</span> · <span lang="hi">इंटरनेट कनेक्शन जाँचें।</span></p>
  <a id="retry" href="https://bkesari.com/">Try again</a>
</main>
<script src="config.js"></script>
<script>
  // The site this build opens (www/config.js); the link above is the store build's.
  if (window.BKESARI_APP) document.getElementById('retry').href = window.BKESARI_APP.site + '/';
</script>
</body>
</html>
