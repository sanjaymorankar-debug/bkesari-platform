<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bkesari</title>
<meta name="description" content="One home for the bkesari projects: dairy ordering, education, community, tasks and trading intelligence.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🟠</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared/page.css">
<style>
  /* Only what is specific to the welcome page; tokens and layout come from
     /shared/page.css, so the three hub pages cannot drift apart. */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
  .card{display:flex;gap:14px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);
    border-radius:14px;padding:20px;text-decoration:none;color:inherit;box-shadow:var(--shadow);
    transition:transform .15s,border-color .15s}
  .card:hover,.card:focus-visible{transform:translateY(-2px);border-color:var(--accent);outline:none}
  .icon{font-size:26px;width:48px;height:48px;border-radius:12px;background:var(--accent-soft);
    display:flex;align-items:center;justify-content:center;flex:none}
  /* Spans, so the whole card stays one <a>; block so they stack. */
  .card-name{display:block;font-weight:700;font-size:16px;margin-bottom:3px}
  .card-tag{display:block;color:var(--ink-soft);font-size:13.5px;line-height:1.4}
  .card-path{display:block;color:var(--ink-faint);font-size:12px;margin-top:8px;
    font-family:ui-monospace,monospace}
  .noscript{background:var(--surface);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin-bottom:24px}
  .noscript ul{margin:8px 0 0;padding-left:20px}
</style>
</head>
<body>
<!-- The top bar is injected here by the shared menu: one script tag, no markup. -->
<div data-bkesari-menu></div>

<main>
  <h1>Welcome to bkesari</h1>
  <p class="lead">One home for all of our projects. Pick a tab above, or choose from the list below.</p>

  <noscript>
    <div class="noscript">
      <strong>The menu above needs JavaScript to appear.</strong> Every project is still reachable:
      <ul>
        <li><a href="/milk/">Milk &amp; Dairy Products</a></li>
        <li><a href="/edu/">Education</a></li>
        <li><a href="/global-warming/">Global Warming</a></li>
        <li><a href="/ladwani/">LadWani</a></li>
        <li><a href="/tasks/">TaskList</a></li>
        <li><a href="/atip/">ATIP</a></li>
        <li><a href="/driving-simulator/">Driving Simulator</a></li>
      </ul>
    </div>
  </noscript>

  <div class="grid" id="cards"></div>
</main>

<footer>&copy; <span id="year"></span> bkesari.com</footer>

<script src="/shared/menu.js"></script>
<script>
// The cards are built from the menu's own TABS, so the welcome page and the bar
// can never list different projects.
(function () {
  const menu = window.BKESARI_MENU;
  if (!menu) return; // the <noscript> list above already covers this
  const esc = menu.escapeHtml;
  document.getElementById('cards').innerHTML = menu.TABS.map((tab) => `
    <a class="card" href="${esc(tab.path)}">
      <span class="icon" aria-hidden="true">${esc(tab.icon || '•')}</span>
      <span>
        <span class="card-name">${esc(tab.name)}</span>
        <span class="card-tag">${esc(tab.tagline || '')}</span>
        <span class="card-path">${esc(tab.path)}</span>
      </span>
    </a>`).join('');
  document.getElementById('year').textContent = new Date().getFullYear();
})();
</script>
</body>
</html>
