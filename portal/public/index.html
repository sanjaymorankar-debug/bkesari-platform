<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bkesari</title>
<meta name="description" content="Welcome to bkesari.com">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🟠</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F6F4EF; --surface:#FFFFFF; --ink:#1B1D24; --ink-soft:#5F6472; --ink-faint:#9A9EA9;
    --line:#E6E2D9; --accent:#E0761F; --accent-soft:#FDF0E3; --accent-dark:#B85A0E;
    --shadow:0 1px 2px rgba(20,24,33,.05),0 8px 24px rgba(20,24,33,.07);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#14151A; --surface:#1D1F26; --ink:#ECEDF1; --ink-soft:#A4A8B4; --ink-faint:#6F7380;
      --line:#2C2F38; --accent:#F08A34; --accent-soft:#3A2715; --accent-dark:#FFB273;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#14151A; --surface:#1D1F26; --ink:#ECEDF1; --ink-soft:#A4A8B4; --ink-faint:#6F7380;
    --line:#2C2F38; --accent:#F08A34; --accent-soft:#3A2715; --accent-dark:#FFB273;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column}
  header{padding:18px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
  .bar{max-width:1080px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .brand{font-weight:800;font-size:20px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
  .brand-dot{width:12px;height:12px;border-radius:50%;background:var(--accent)}
  nav.menu{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
  nav.menu a{color:var(--ink-soft);text-decoration:none;font-size:14px;font-weight:600;padding:8px 10px;border-radius:8px}
  nav.menu a:hover{background:var(--accent-soft);color:var(--accent-dark)}
  .env-pill{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--accent-soft);color:var(--accent-dark);padding:3px 8px;border-radius:20px}
  main{flex:1;width:100%;max-width:1080px;margin:0 auto;padding:48px 16px}
  h1{font-size:clamp(28px,5vw,44px);letter-spacing:-.03em;margin:0 0 10px;line-height:1.1}
  .lead{color:var(--ink-soft);font-size:17px;margin:0 0 36px;max-width:560px;line-height:1.5}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
  .card{display:flex;gap:14px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;text-decoration:none;color:inherit;box-shadow:var(--shadow);transition:transform .15s,border-color .15s}
  .card:hover,.card:focus-visible{transform:translateY(-2px);border-color:var(--accent);outline:none}
  .icon{font-size:26px;width:48px;height:48px;border-radius:12px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;flex:none}
  .card-name{font-weight:700;font-size:16px;margin-bottom:3px}
  .card-tag{color:var(--ink-soft);font-size:13.5px;line-height:1.4}
  .card-url{color:var(--ink-faint);font-size:12px;margin-top:8px;word-break:break-all}
  footer{text-align:center;color:var(--ink-faint);font-size:12.5px;padding:24px 16px}
  @media (max-width:640px){ nav.menu{display:none} main{padding-top:32px} }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand"><span class="brand-dot"></span>bkesari <span class="env-pill" id="envPill" hidden></span></div>
    <nav class="menu" id="topMenu" aria-label="Sites"></nav>
  </div>
</header>
<main>
  <h1>Welcome to bkesari</h1>
  <p class="lead">One home for all our platforms. Choose where you want to go.</p>
  <div class="grid" id="cards"></div>
</main>
<footer>&copy; <span id="year"></span> bkesari.com</footer>

<script src="sites.js"></script>
<script>
(function(){
  const cfg = window.BKESARI;
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const hrefOf = s => s.url ? s.url : `https://${cfg.ENV_PREFIX}${s.sub}.${cfg.DOMAIN}`.toLowerCase();
  const labelOf = s => s.url ? `${location.host}${s.url}` : hrefOf(s).replace('https://', '');

  document.getElementById('topMenu').innerHTML =
    cfg.SITES.map(s => `<a href="${esc(hrefOf(s))}">${esc(s.name)}</a>`).join('');
  document.getElementById('cards').innerHTML = cfg.SITES.map(s => `
    <a class="card" href="${esc(hrefOf(s))}">
      <span class="icon" aria-hidden="true">${esc(s.icon || '•')}</span>
      <span>
        <div class="card-name">${esc(s.name)}</div>
        <div class="card-tag">${esc(s.tagline || '')}</div>
        <div class="card-url">${esc(labelOf(s))}</div>
      </span>
    </a>`).join('');
  if (cfg.ENV_PREFIX) {
    const pill = document.getElementById('envPill');
    pill.textContent = cfg.ENV_PREFIX; pill.hidden = false;
  }
  document.getElementById('year').textContent = new Date().getFullYear();
})();
</script>
</body>
</html>
