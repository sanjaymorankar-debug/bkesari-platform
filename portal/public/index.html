<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bkesari</title>
<meta name="description" content="One home for the bkesari projects: community, education, tasks and more.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🟠</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared/page.css">
<style>
  /* Only what is specific to the welcome page; tokens and layout come from
     /shared/page.css, so the three hub pages cannot drift apart. */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
  .card{display:flex;gap:14px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);
    border-radius:14px;padding:20px;text-decoration:none;color:inherit;box-shadow:var(--shadow);
    transition:transform .15s,border-color .15s}
  .card:hover,.card:focus-visible{transform:translateY(-2px);border-color:var(--accent);outline:none}
  .icon{font-size:26px;width:48px;height:48px;border-radius:12px;background:var(--accent-soft);
    display:flex;align-items:center;justify-content:center;flex:none}
  /* Spans, so the whole card stays one <a>; block so they stack. */
  .card-name{display:block;font-weight:700;font-size:16px;margin-bottom:3px}
  .card-tag{display:block;color:var(--ink-soft);font-size:13.5px;line-height:1.4}
  .card-path{display:block;color:var(--ink-faint);font-size:12px;margin-top:8px;
    font-family:ui-monospace,monospace}
  .btn{display:inline-block;min-height:44px;line-height:44px;padding:0 18px;border-radius:10px;background:var(--accent);color:#fff;font-weight:600;text-decoration:none}
  .noscript{background:var(--surface);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin-bottom:24px}
  .noscript ul{margin:8px 0 0;padding-left:20px}
</style>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#C2560A">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="bkesari">
</head>
<body>
<!-- The top bar is injected here by the shared menu: one script tag, no markup. -->
<div data-bkesari-menu></div>

<main>
  <h1>Welcome to bkesari</h1>
  <p class="lead">One home for all of our projects. One bkesari ID signs you in; each project then decides what you may open.</p>
  <p id="who" class="lead"></p>

  <noscript>
    <div class="noscript">
      <strong>The menu above needs JavaScript to appear.</strong> Every project is still reachable:
      <ul>
        <li><a href="/ladwani/">LadWani</a></li>
        <li><a href="/edu/">Education</a></li>
        <li><a href="/tasklist/">TaskList</a></li>
        <li><a href="/driving-simulator/">Driving Simulator</a></li>
        <li><a href="/environment/">Environmental Activities</a></li>
      </ul>
    </div>
  </noscript>

  <div class="grid" id="cards"></div>
</main>

<footer>&copy; <span id="year"></span> bkesari.com</footer>

<script src="/shared/menu.js"></script>
<script>
// The cards are built from the menu's own TABS, so the welcome page and the bar
// can never list different projects. /hub/api/me then says who is looking:
// a visitor sees every open project plus "Sign in"; a signed-in person sees
// whether each protected project is open to them, waiting, or needs a request.
(function () {
  const menu = window.BKESARI_MENU;
  if (!menu) return; // the <noscript> list above already covers this
  const esc = menu.escapeHtml;
  const paint = (me) => {
    const byPath = {};
    ((me && me.projects) || []).forEach((p) => { byPath[p.path.toLowerCase()] = p; });
    const tabs = menu.TABS.filter((t) => !t.ownerOnly || (me && me.owner));
    document.getElementById('cards').innerHTML = tabs.map((tab) => {
      const p = byPath[tab.path.toLowerCase()];
      const state = p ? p.state : 'open';
      const href = state === 'request' ? '/access/request?project=' + encodeURIComponent(p.key) : tab.path;
      const badge = state === 'request' ? 'Request access' : state === 'pending' ? 'Waiting for approval'
        : state === 'signin' ? 'Sign in required' : '';
      return `
    <a class="card" href="${esc(href)}">
      <span class="icon" aria-hidden="true">${esc(tab.icon || '•')}</span>
      <span>
        <span class="card-name">${esc(tab.name)}</span>
        <span class="card-tag">${esc(tab.tagline || '')}</span>
        ${badge ? `<span class="card-path">${esc(badge)}</span>` : ''}
      </span>
    </a>`;
    }).join('');
    const who = document.getElementById('who');
    if (me && me.user) {
      who.innerHTML = `Signed in as <strong>${esc(me.user.email)}</strong>` +
        (me.canAdmin ? ` · <a href="/admin/access">Access admin</a>` : '') +
        ` · <a href="#" id="signout">Sign out</a>`;
      document.getElementById('signout').onclick = async (e) => {
        e.preventDefault();
        await fetch('/api/auth/sign-out', { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: '{}' }).catch(() => {});
        location.reload();
      };
    } else {
      who.innerHTML = `<a class="btn" href="/auth/sign-in">Sign in</a>`;
    }
  };
  paint(null);
  fetch('/hub/api/me', { credentials: 'same-origin' }).then((r) => (r.ok ? r.json() : null)).then((me) => { if (me) paint(me); }).catch(() => {});
  document.getElementById('year').textContent = new Date().getFullYear();
})();
</script>
</body>
</html>
