<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline — bkesari</title>
<meta name="theme-color" content="#C2560A">
<style>
  :root{--bg:#F6F4EF;--ink:#1B1D24;--soft:#5F6472;--accent:#C2560A}
  @media (prefers-color-scheme:dark){:root{--bg:#111315;--ink:#ECEDEE;--soft:#B9BFC6;--accent:#F08A3C}}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif;padding:16px;box-sizing:border-box;text-align:center}
  h1{font-size:24px;margin:0 0 8px}p{color:var(--soft);margin:0 0 20px}
  button{min-height:44px;padding:0 20px;border:0;border-radius:10px;background:var(--accent);color:#fff;font:inherit;font-weight:600}
</style>
</head>
<body>
<main>
  <h1>You are offline</h1>
  <p>bkesari needs a connection for this page. Check your network and try again.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
