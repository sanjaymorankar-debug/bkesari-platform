<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline — bkesari</title>
<meta name="theme-color" content="#C2560A">
<style>
  :root{--bg:#F6F4EF;--ink:#1B1D24;--soft:#57534E;--accent:#C2560A}
  @media (prefers-color-scheme:dark){:root{--bg:#111315;--ink:#ECEDEE;--soft:#B9BFC6;--accent:#F08A3C}}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.5 'Mukta',system-ui,sans-serif;padding:16px;box-sizing:border-box;text-align:center}
  h1{font-size:24px;margin:0 0 8px}p{color:var(--soft);margin:0 0 20px}
  .retry{display:inline-flex;align-items:center;min-height:48px;padding:0 20px;border-radius:10px;background:#C2560A;color:#fff;font-weight:600;text-decoration:none}
</style>
</head>
<body>
<main>
  <h1>You are offline</h1>
  <p>bkesari needs a connection for this page. Check your network and try again.</p>
  <a class="retry" href="">Try again</a>
</main>
</body>
</html>
