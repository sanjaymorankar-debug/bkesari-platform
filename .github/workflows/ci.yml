# This repository had no CI until the deploy workflows arrived, which meant the
# shared menu — the one file every project on every tier includes — had nothing
# watching it. These are the checks the dev deploys are gated on.
name: CI

on:
  push:
    branches: [main, dev, staging]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Catches a syntax error in the server before a deploy does, since the
      # hub has no build step that would otherwise notice.
      - name: Parse the server and the shared menu
        run: npm run check

      # The menu's unit tests, plus the deploy guard's own tests: the rules
      # that keep a dev deploy off test and production are themselves tested.
      - name: Tests
        run: npm test

      # The app has to survive being started, not just parsed. sqlite needs no
      # server, so this runs without touching any real database.
      - name: Start the hub and fetch the welcome page
        env:
          DB_CLIENT: sqlite
          SQLITE_PATH: ./data/ci.db
          PORT: 3100
          APP_ENV: dev
        run: |
          set -euo pipefail
          npm start & echo $! > /tmp/hub.pid
          for attempt in $(seq 1 20); do
            if curl -fsS --max-time 5 http://127.0.0.1:3100/ -o /tmp/home.html; then break; fi
            [ "$attempt" = 20 ] && { echo "::error::the hub did not start"; exit 1; }
            sleep 1
          done
          # The bar is injected by a script, so the served HTML carries the
          # include and the <noscript> fallback rather than the rendered tabs.
          grep -q '/shared/menu.js' /tmp/home.html
          grep -q 'Driving Simulator' /tmp/home.html
          # The two static pages and the shared assets are actually served.
          curl -fsS --max-time 5 http://127.0.0.1:3100/shared/menu.js -o /dev/null
          curl -fsS --max-time 5 http://127.0.0.1:3100/shared/page.css -o /dev/null
          curl -fsS --max-time 5 http://127.0.0.1:3100/global-warming/ -o /dev/null
          curl -fsS --max-time 5 http://127.0.0.1:3100/driving-simulator/ -o /dev/null
          # A tab whose project is not on this tier still answers 404 — it is
          # genuinely not there, and the X-Robots-Tag keeps it out of indexes —
          # but with a page that carries the menu, so navigation continues
          # instead of dead-ending. No -f here: 404 is the expected status.
          code=$(curl -sS --max-time 5 -o /tmp/milk.html -w '%{http_code}' \
            http://127.0.0.1:3100/milk/)
          [ "$code" = 404 ] || { echo "::error::/milk/ answered $code, expected 404"; exit 1; }
          grep -q 'not on this tier yet' /tmp/milk.html
          grep -q 'bk-tabs' /tmp/milk.html
          kill "$(cat /tmp/hub.pid)"
