# This repository had no CI until the deploy workflows arrived, which meant the
# shared menu — the one file every project on every tier includes — had nothing
# watching it. These are the checks the dev deploys are gated on.
name: CI

on:
  push:
    branches: [main, dev, staging]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    # The portal's database. Disposable: the tracker tests wipe their tables.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bk_portal
          POSTGRES_PASSWORD: ci-only-not-a-real-password
          POSTGRES_DB: bk_portal_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bk_portal -d bk_portal_test"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Catches a syntax error in the server before a deploy does, since the
      # hub has no build step that would otherwise notice.
      - name: Parse the server and the shared menu
        run: npm run check

      # The menu's unit tests, the Task Tracker and ATIP snapshot routes against
      # the real PostgreSQL above, plus the deploy guard's own tests: the rules
      # that keep a dev deploy off test and production are themselves tested.
      - name: Tests
        env:
          TEST_DATABASE_URL: postgresql://bk_portal:ci-only-not-a-real-password@127.0.0.1:5432/bk_portal_test
        run: npm test

      # The app has to survive being started, not just parsed — and the smoke
      # script that gates every deploy should itself be exercised somewhere.
      # It runs against the CI PostgreSQL service, never a real database. The
      # logins are set so the access-control checks have something to assert;
      # unset, the tracker would be open and the smoke test would (correctly)
      # fail.
      - name: Start the hub and run the smoke test against it
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_NAME: bk_portal_test
          DB_USER: bk_portal
          DB_PASSWORD: ci-only-not-a-real-password
          PORT: 3100
          APP_ENV: dev
          TRACKER_USER: ci
          TRACKER_PASSWORD: ci-only-not-a-real-password
          ATIP_USER: ci
          ATIP_PASSWORD: ci-only-not-a-real-password
          ATIP_PUBLISH_TOKEN: ci-only-not-a-real-token
        run: |
          set -euo pipefail
          npm start & echo $! > /tmp/hub.pid
          for attempt in $(seq 1 20); do
            if curl -fsS --max-time 5 http://127.0.0.1:3100/ -o /dev/null; then break; fi
            [ "$attempt" = 20 ] && { echo "::error::the hub did not start"; exit 1; }
            sleep 1
          done

          # The same script the deploy workflow runs against dev.bkesari.com.
          bash scripts/smoke-dev.sh http://127.0.0.1:3100 --env dev

          # The hub states its tier in a header; the smoke test above relies on
          # it, so check the value itself here rather than only that it exists.
          env=$(curl -sSI --max-time 5 http://127.0.0.1:3100/ \
            | tr -d '\r' | grep -i '^x-bkesari-env:' | cut -d' ' -f2)
          [ "$env" = dev ] || { echo "::error::the hub reports tier '$env', expected 'dev'"; exit 1; }

          # Not covered by the smoke test, which has no credentials: that the
          # logins actually admit the right ones.
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 5 \
            -u ci:ci-only-not-a-real-password http://127.0.0.1:3100/tasks/)
          [ "$code" = 200 ] || { echo "::error::correct tracker credentials were refused ($code)"; exit 1; }
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 5 \
            -u ci:wrong-password http://127.0.0.1:3100/tasks/)
          [ "$code" = 401 ] || { echo "::error::a wrong tracker password was not rejected ($code)"; exit 1; }

          kill "$(cat /tmp/hub.pid)"

  # edu/ has 375 PHPUnit tests that nothing was running. They use in-memory
  # sqlite (see edu/phpunit.xml), so they need no database service and finish
  # in about twelve seconds — there was no good reason for them to sit unrun.
  edu:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: edu

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          # Matches composer.json's "php": "^8.3" and Hostinger's PHP version.
          php-version: '8.3'
          extensions: mbstring, bcmath, pdo_sqlite, sqlite3, zip, intl, gd
          coverage: none

      - name: Install dependencies
        run: |
          composer validate --no-check-publish
          composer install --no-interaction --no-progress

      # phpunit.xml supplies APP_ENV and the sqlite settings, but not APP_KEY,
      # and the encrypter refuses to boot without one.
      - name: Configure for testing
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Tests
        run: php artisan test

      # The compiled front-end assets are committed, so a manifest that names
      # a file which is not there means every page 500s on a missing asset.
      - name: Check the built assets match the manifest
        run: |
          set -euo pipefail
          test -f public/build/manifest.json
          python3 - <<'PY'
          import json, os, sys
          manifest = json.load(open('public/build/manifest.json'))
          missing = [e['file'] for e in manifest.values()
                     if not os.path.exists(os.path.join('public/build', e['file']))]
          for e in manifest.values():
              missing += [c for c in e.get('css', [])
                          if not os.path.exists(os.path.join('public/build', c))]
          if missing:
              sys.exit('public/build/manifest.json references missing files: '
                       + ', '.join(missing))
          print(f'{len(manifest)} manifest entries, all present')
          PY
